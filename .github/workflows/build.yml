name: Build and Release FakeWindow Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.8' # Updated to 8.8 to satisfy fabric-loom 1.7.1 requirements
      
    - name: Build Mod with Gradle
      run: gradle build

    - name: Rename Mod File
      run: |
        find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" -exec mv {} build/libs/FakeWindow-1.00.jar \;

    - name: Upload to GitHub Releases
      uses: ncipollo/release-action@v1
      if: github.event_name == 'push'
      with:
        tag: "latest"
        name: "FakeWindow - Latest Build"
        body: "Automatically built FakeWindow mod for Minecraft 1.21.x by GreekoASC."
        artifacts: "build/libs/FakeWindow-1.00.jar"
        allowUpdates: true
        replacesArtifacts: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
