name: Build and Release FakeWindow Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Grant permission to create and update releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Mod with Gradle
      # Using standard gradle command as requested
      run: gradle build

    - name: Rename Mod File
      run: |
        # Find the main compiled jar (ignoring -dev and -sources jars) and rename it to FakeWindow-1.00.jar
        find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" -exec mv {} build/libs/FakeWindow-1.00.jar \;

    - name: Upload to GitHub Releases
      uses: ncipollo/release-action@v1
      # Only create a release when code is pushed to main/master, not on pull requests
      if: github.event_name == 'push'
      with:
        tag: "latest"
        name: "FakeWindow - Latest Build"
        body: "Automatically built FakeWindow mod for Minecraft 1.21.x by GreekoASC."
        artifacts: "build/libs/FakeWindow-1.00.jar"
        allowUpdates: true          # Allows replacing the release if it already exists
        replacesArtifacts: true     # Automatically deletes the old .jar and uploads the new one
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
